<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/example.css') }}">
  <title>{{page_title}}</title>
  <style>
    html, body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* ===== Base layout: normal top-to-bottom page. Used as-is on
       pages with a table (states/countries/state_view) -- solid
       backgrounds throughout, map sized to a reasonable chunk of the
       page rather than filling it. The map-only page (counties, no
       table) overrides this below into a full-bleed background. ===== */

    /* Nav buttons + Logout: one row, all the same height. Overrides
       example.css's position/width rules for .btn (fixed 90px) and
       .button-container/.top-right-nav (position: absolute), which
       otherwise pull them out of normal document flow. */
    .top-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 0.4rem;
      background: #fff;
      padding: 0.4rem 0.5rem;
      box-sizing: border-box;
    }

    .top-bar .btn,
    .top-bar .logout-btn {
      position: static;
      flex: 1 1 0;
      min-width: 0;
      width: auto;
      margin: 0;
      padding: 8px 4px;
      font-size: 0.8rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* "Add Country" row: overrides example.css's #country-form/.form-inline
       rules (fixed position, and a column layout below 800px) so it
       stays one row with the input flexing to fill remaining space. */
    .country-bar {
      background: #fff;
      padding: 0.4rem 0.5rem;
      box-sizing: border-box;
    }

    .country-bar #country-form {
      position: static;
      top: auto;
      left: auto;
      height: auto;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0.4rem;
      max-width: 480px;
      margin: 0 auto;
    }

    .country-bar #country-form label {
      flex: 0 0 auto;
      margin: 0;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* Wraps the input so the suggestions dropdown (absolutely
       positioned) has something to anchor to -- takes over the flex
       sizing the input itself used to have directly. */
    .country-bar #country-form .country-autocomplete {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .country-bar #country-form input {
      width: 100%;
      margin: 0;
      padding: 6px 8px;
      font-size: 0.85rem;
      box-sizing: border-box;
    }

    .country-bar #country-form button {
      flex: 0 0 auto;
      margin: 0;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    /* Add Country autocomplete dropdown -- filters client-side as you
       type, matching name or either ISO code (see the JS below). */
    .country-suggestions {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 2px;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      z-index: 5;
      text-align: left;
    }

    .country-suggestions.open {
      display: block;
    }

    .country-suggestion-item {
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .country-suggestion-item:hover {
      background: #eaeef3;
    }

    .country-suggestion-code {
      color: #777;
      margin-left: 0.4rem;
    }

    .title-bar {
      background: #fff;
      padding: 0.4rem 0.75rem;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      text-align: initial;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #chart {
      width: 100%;
      height: 55vh;
      min-height: 320px;
      box-sizing: border-box;
    }

    .table-container {
      width: 100%;
      max-width: 900px;
      margin: 1rem auto 2rem;
      background: #fff;
      padding: 0 1rem 1rem;
      box-sizing: border-box;
      overflow-x: auto;
    }

    .dataframe {
      left: 0%;
    }

    .table-container table {
      margin: 0 auto;
      border-collapse: collapse;
    }

    .table-container th,
    .table-container td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: center;
    }

    /* State list as a responsive card grid: one column when narrow
       (mobile), auto-fitting to more columns as width allows (desktop)
       -- driven entirely by available width, no device detection. */
    .state-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.6rem;
    }

    .state-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.9rem;
      background: #f5f7fa;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
    }

    .state-card:hover {
      background: #eaeef3;
    }

    .state-card-name {
      font-weight: bold;
      text-align: left;
    }

    .state-card-stat {
      color: #555;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* ===== map-only override: full-bleed background map. A page with
       no table (counties) makes the map the entire page. A page that
       also has a table (countries) needs the .with-table shrink below
       -- #chart is position:fixed, so at full 100svh height it covers
       the *entire* viewport at every scroll position, not just at the
       top. Combined with touch-action:none, that leaves literally no
       spot on screen where a touch can start a native scroll once the
       (non-fixed, in-flow) header bars have scrolled out of view --
       the page gets stuck, unreachable at either end, until reload. ===== */
    body.map-only {
      height: 100%;
    }

    body.map-only #chart {
      touch-action: none;   /* let Plotly's own pinch/pan handle mobile gestures */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;   /* fallback for browsers without svh support */
      height: 100svh;  /* "small" viewport height -- the guaranteed-visible
                          size, unlike 100vh which on mobile is often the
                          *largest* possible size (address bar hidden) and
                          can extend below what's actually on screen */
      z-index: 0;
    }

    /* Cap the map short of the full viewport so a permanent, non-map
       strip is always on screen -- regardless of scroll position -- for
       native touch-scroll to latch onto. Matches the table's margin-top
       below so the table starts right where the map ends, no dead gap. */
    body.map-only.with-table #chart {
      height: 90vh;
      height: 90svh;
    }

    body.map-only .top-bar,
    body.map-only .title-bar {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.9);
    }

    /* Higher than .top-bar/.title-bar (and .year-slider-bar below):
       z-index only ranks elements against siblings within the same
       stacking context, and .country-bar is that context for the
       autocomplete dropdown inside it (position:relative promotes it
       to one). The dropdown's own z-index:5 only wins locally, within
       .country-bar -- .country-bar itself was tied at z-index:1 with
       .title-bar, and lost that tie by coming first in the DOM, so the
       whole dropdown (bar and all) painted under the title text. */
    body.map-only .country-bar {
      position: relative;
      z-index: 3;
      background: rgba(255, 255, 255, 0.9);
    }

    /* #chart is fixed and takes no space in the document flow, so
       without this the table would start right under the header bars
       and hide the map immediately instead of leaving it visible until
       scrolled past. margin-top pushes the table down to start right
       where the (now 90%-capped, see .with-table above) map ends;
       position/z-index is the same "paint above the fixed map"
       treatment as the header bars use. */
    body.map-only.with-table .table-container {
      position: relative;
      z-index: 1;
      margin-top: 90vh;
      margin-top: 90svh;
      padding-top: 1rem;   /* breathing room above the first row of cards --
                               the base .table-container rule has no
                               padding-top, so cards would otherwise sit
                               flush against the container's top edge */
    }

    /* Year slider: replaces the old static colorbar. Portrait gets a
       horizontal bar in the stacked header (matches the other rows);
       landscape floats it vertically on the right edge instead, since
       landscape screens are short on vertical space to spare. */
    body.map-only .year-slider-bar {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.75rem;
      box-sizing: border-box;
      font-size: 0.85rem;
    }

    body.map-only .year-slider-bar input[type="range"] {
      flex: 1 1 auto;
      min-width: 0;
    }

    body.map-only .year-slider-value {
      flex: 0 0 auto;
      font-weight: bold;
      white-space: nowrap;
    }

    @media (orientation: landscape) {
      body.map-only .year-slider-bar {
        position: fixed;
        top: 50%;
        right: 0.5rem;
        transform: translateY(-50%);
        flex-direction: column;
        width: auto;
        height: 220px;
        border-radius: 8px;
        z-index: 2;
      }

      body.map-only .year-slider-bar input[type="range"] {
        writing-mode: vertical-lr;
        width: 8px;
      }
    }
  </style>
</head>
<body class="{{ 'map-only' if full_bleed_map else 'has-table' }}{{ ' with-table' if full_bleed_map and more_html else '' }}">
  <!-- Nav buttons + Logout: one clean row -->
  <div class="top-bar">
    <a class='btn' href="counties">Counties</a>
    <a class='btn' href="states">States</a>
    <a class='btn' href="countries">Countries</a>
    <a class='btn' href="/">Map</a>
    <a href="/logout" class="logout-btn">Logout</a>
  </div>

  <!-- Add Country: one clean row -->
  <div class="country-bar">
    <form class="form-inline" id="country-form" action="/log_country">
      <label for="start">Add Country</label>
      <div class="country-autocomplete">
        <input type="text" id="start" placeholder="<Country Name or Code>" name="country" autocomplete="off">
        <div id="country-suggestions" class="country-suggestions"></div>
      </div>
      <button type="submit">Submit</button>
    </form>
  </div>

  <!-- Title: one clean text line -->
  <div class="title-bar">
    <h1>{{title}} {{stat_string}}</h1>
  </div>

  <!-- Year slider: cumulative "visited by year X" filter -->
  {% if mapbox_bounds_json %}
  <div class="year-slider-bar">
    <span class="year-slider-value" id="yearSliderValue">&nbsp;</span>
    <input type="range" id="yearSlider" step="1">
  </div>
  {% endif %}

  <!-- Plotly chart -->
  <div id="chart"></div>

  <!-- Table -->
  {% if more_html %}
  <div class="table-container">
    {{ more_html|safe }}
  </div>
  {% endif %}

  <!-- Add Country autocomplete: filters the full country list
       client-side as you type, matching name or either ISO code.
       Independent of the map/graph JS below -- present on every page,
       since .country-bar is in the shared top nav. -->
  <script type='text/javascript'>
    (function() {
      var countryList = {{ country_list_json | safe }};
      var input = document.getElementById('start');
      var suggestionsBox = document.getElementById('country-suggestions');
      if (!input || !suggestionsBox) return;

      var MAX_SUGGESTIONS = 8;

      function filterCountries(query) {
        var q = query.trim().toLowerCase();
        if (!q) return [];

        var startsWith = [];
        var contains = [];
        countryList.forEach(function(c) {
          var name = c.name.toLowerCase();
          var iso2 = (c.iso_2 || '').toLowerCase();
          var iso3 = (c.iso_3 || '').toLowerCase();
          if (name.indexOf(q) === -1 && iso2.indexOf(q) === -1 && iso3.indexOf(q) === -1) return;
          if (name.indexOf(q) === 0 || iso2 === q || iso3 === q) {
            startsWith.push(c);
          } else {
            contains.push(c);
          }
        });
        startsWith.sort(function(a, b) { return a.name.localeCompare(b.name); });
        contains.sort(function(a, b) { return a.name.localeCompare(b.name); });
        return startsWith.concat(contains).slice(0, MAX_SUGGESTIONS);
      }

      function closeSuggestions() {
        suggestionsBox.classList.remove('open');
        suggestionsBox.innerHTML = '';
      }

      function renderSuggestions(matches) {
        suggestionsBox.innerHTML = '';
        matches.forEach(function(c) {
          var item = document.createElement('div');
          item.className = 'country-suggestion-item';
          item.textContent = c.name;
          var code = document.createElement('span');
          code.className = 'country-suggestion-code';
          code.textContent = c.iso_3;
          item.appendChild(code);
          // mousedown, not click -- fires before the input's blur, so
          // the value is set before the blur handler closes the list.
          item.addEventListener('mousedown', function(e) {
            e.preventDefault();
            input.value = c.name;
            closeSuggestions();
          });
          suggestionsBox.appendChild(item);
        });
        suggestionsBox.classList.toggle('open', matches.length > 0);
      }

      input.addEventListener('input', function() {
        renderSuggestions(filterCountries(input.value));
      });

      input.addEventListener('focus', function() {
        if (input.value.trim()) renderSuggestions(filterCountries(input.value));
      });

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeSuggestions();
      });

      input.addEventListener('blur', function() {
        setTimeout(closeSuggestions, 150);
      });
    })();
  </script>

  <script src='https://cdn.plot.ly/plotly-latest.min.js'></script>
  <script type='text/javascript'>
    var graphs = {{graphJSON | safe}};
    var config = {responsive: true, displaylogo: false, scrollZoom: true, displayModeBar: false};
    var plotReady = Plotly.newPlot('chart', graphs.data, graphs.layout, config);

    {% if mapbox_bounds_json %}
    // The zoom baked into the figure server-side is only a guess
    // (the server doesn't know the visitor's actual screen size) --
    // refit each mapbox subplot's zoom against its real rendered
    // pixel size once the page knows it.
    (function() {
      var mapBounds = {{ mapbox_bounds_json | safe }};

      function mercatorY(latDeg) {
        var latRad = Math.max(Math.min(latDeg, 85.05), -85.05) * Math.PI / 180;
        return Math.log(Math.tan(Math.PI / 4 + latRad / 2));
      }

      function fitZoom(bounds, boxWidthPx, boxHeightPx, padding) {
        padding = padding || 0.85;
        var lonSpan = bounds[2] - bounds[0];
        var ySpan = mercatorY(bounds[3]) - mercatorY(bounds[1]);
        var zoomX = Math.log2((boxWidthPx * padding * 360) / (lonSpan * 256));
        var zoomY = Math.log2((boxHeightPx * padding * 2 * Math.PI) / (ySpan * 256));
        return Math.min(zoomX, zoomY);
      }

      function refitMaps() {
        var chartDiv = document.getElementById('chart');
        var chartW = chartDiv.clientWidth;
        var chartH = chartDiv.clientHeight;

        // Plotly.relayout doesn't reliably resize a mapbox subplot's
        // underlying map canvas when its domain changes after the
        // initial draw (zoom-only changes are fine with relayout;
        // domain changes are not) -- Plotly.react with a full new
        // layout is the documented way to handle that kind of
        // structural change.
        var newLayout = JSON.parse(JSON.stringify(graphs.layout));

        // Continental map: left at its server-set zoom (3) and full
        // domain -- it's not being fit to a bounding box, so there's
        // nothing to correct here.

        // AK/HI insets: equal-size square boxes, sized as a
        // percentage of the smaller viewport dimension so they scale
        // up on a bigger desktop window instead of staying phone-sized
        // (a domain of equal x/y *fractions* would not itself be
        // square unless the viewport is square). Once the box is a
        // known square, the same fitZoom used above just works -- it
        // already picks whichever axis (lon or lat) is the tighter
        // constraint. A looser padding (more margin) than the
        // continental map's default, since a snug fit was clipping
        // Hawaii's Big Island / Alaska's North Slope.
        var squarePx = Math.min(chartW, chartH) * 0.20;
        var marginPx = squarePx * 0.08;
        var insets = [
          {key: 'mapbox2', bounds: mapBounds.mapbox2, x0: marginPx},
          {key: 'mapbox3', bounds: mapBounds.mapbox3, x0: marginPx * 2 + squarePx},
        ];
        insets.forEach(function(inset) {
          if (!inset.bounds || !newLayout[inset.key]) return;
          var x0 = inset.x0, x1 = inset.x0 + squarePx;
          var y0 = marginPx, y1 = marginPx + squarePx;
          newLayout[inset.key].domain = {x: [x0 / chartW, x1 / chartW], y: [y0 / chartH, y1 / chartH]};
          newLayout[inset.key].zoom = fitZoom(inset.bounds, squarePx, squarePx, 0.45);
        });

        return Plotly.react('chart', graphs.data, newLayout, config);
      }

      // Serialize every refit through one promise chain -- calling
      // Plotly.react again on the same mapbox subplots before a prior
      // call has finished can corrupt their rendering (this is likely
      // what made the insets vanish on mobile: the browser fires a
      // resize event almost immediately after load as the address bar
      // collapses, which was racing with the initial refit).
      var refitChain = Promise.resolve();
      function scheduleRefit() {
        refitChain = refitChain.then(refitMaps).catch(function(err) {
          console.error('refitMaps failed:', err);
        });
      }

      // Plotly.newPlot returns a promise that resolves once the plot
      // (including loading the mapbox tile styles) is actually ready;
      // calling react()/relayout() before that resolves can silently
      // no-op for mapbox subplots.
      plotReady.then(scheduleRefit).catch(function(err) {
        console.error('initial plot failed:', err);
      });

      // Debounced: mobile viewport-height changes (address bar
      // show/hide) can fire several resize events in quick succession.
      var resizeTimer = null;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(scheduleRefit, 250);
      });

      // Year slider: cumulative "counties visited by year X" filter.
      // Every county's year value is already loaded on the page (it's
      // what drives the choropleth color), so this recolors entirely
      // client-side via Plotly.restyle -- no server round-trip.
      //
      // Caveat: the underlying data only stores each county's *most
      // recent* visit year, not every year it was visited, so a
      // county visited in e.g. both 2015 and 2022 only "counts" as
      // visited from 2022 onward here, not 2015. Getting that right
      // needs a schema change to track every visit-year per county.
      var slider = document.getElementById('yearSlider');
      var sliderValueLabel = document.getElementById('yearSliderValue');

      if (slider && mapBounds.yearRange) {
        var YEAR_BASE = 2000;   // matches location_db.get_county_visits_dataframe()
        var UNVISITED_Z = -1;
        var yearMin = mapBounds.yearRange[0];
        var yearMax = mapBounds.yearRange[1];

        slider.min = yearMin;
        slider.max = yearMax;
        slider.value = yearMax;
        sliderValueLabel.textContent = 'Through ' + yearMax;

        // Snapshot the true, unfiltered year for each trace so every
        // slider move recomputes from the original data rather than
        // compounding on top of a previous filter.
        var originalZ = graphs.data.map(function(trace) {
          return trace.z ? trace.z.slice() : null;
        });

        function applyYearFilter() {
          var cutoff = parseInt(slider.value, 10);
          sliderValueLabel.textContent = 'Through ' + cutoff;
          var cutoffOffset = cutoff - YEAR_BASE;

          var traceIndices = [];
          var newZ = [];
          originalZ.forEach(function(z, idx) {
            if (!z) return;
            traceIndices.push(idx);
            newZ.push(z.map(function(v) {
              return (v > UNVISITED_Z && v > cutoffOffset) ? UNVISITED_Z : v;
            }));
          });

          Plotly.restyle('chart', {z: newZ}, traceIndices);
        }

        slider.addEventListener('input', applyYearFilter);
      }
    })();
    {% endif %}
  </script>
</body>
</html>
